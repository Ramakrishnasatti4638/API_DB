<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .app-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .add-todo-section {
            padding: 25px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .controls {
            padding: 20px 25px;
            background: white;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #e9ecef;
            color: #495057;
            font-size: 0.9em;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .priority-filter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .priority-filter select {
            width: auto;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .todo-list {
            padding: 25px;
            max-height: 500px;
            overflow-y: auto;
        }

        .todo-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
            display: flex;
            gap: 15px;
            align-items: start;
        }

        .todo-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .todo-item.completed {
            opacity: 0.7;
            border-left-color: #28a745;
        }

        .todo-item.completed .todo-content h3,
        .todo-item.completed .todo-content p {
            text-decoration: line-through;
            color: #6c757d;
        }

        .todo-item.priority-high {
            border-left-color: #dc3545;
        }

        .todo-item.priority-medium {
            border-left-color: #ffc107;
        }

        .todo-item.priority-low {
            border-left-color: #28a745;
        }

        .todo-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            margin-top: 5px;
        }

        .todo-content {
            flex: 1;
        }

        .todo-content h3 {
            color: #212529;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .todo-content p {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .todo-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.85em;
            color: #6c757d;
        }

        .todo-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .priority-badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75em;
        }

        .priority-high {
            background: #dc3545;
            color: white;
        }

        .priority-medium {
            background: #ffc107;
            color: #212529;
        }

        .priority-low {
            background: #28a745;
            color: white;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit,
        .btn-delete {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .btn-edit {
            background: #17a2b8;
            color: white;
        }

        .btn-edit:hover {
            background: #138496;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .stats {
            padding: 15px 25px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.85em;
            color: #6c757d;
            margin-top: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #212529;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #6c757d;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .btn-close:hover {
            color: #212529;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-buttons {
                width: 100%;
            }

            .filter-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✓ Todo App</h1>
        
        <div class="app-card">
            <div class="add-todo-section">
                <form id="todoForm">
                    <div class="form-group">
                        <label for="title">Todo Title *</label>
                        <input type="text" id="title" placeholder="Enter todo title..." required>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" placeholder="Add details..."></textarea>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="priority">Priority</label>
                            <select id="priority">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label for="dueDate">Due Date</label>
                            <input type="date" id="dueDate">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary">Add Todo</button>
                </form>
            </div>

            <div class="controls">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search todos...">
                </div>
                
                <div class="priority-filter">
                    <select id="priorityFilter">
                        <option value="">All Priorities</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
            </div>

            <div class="todo-list" id="todoList">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                    <h3>No todos yet</h3>
                    <p>Add your first todo to get started!</p>
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="activeCount">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Todo</h2>
                <button class="btn-close" onclick="closeEditModal()">&times;</button>
            </div>
            
            <form id="editForm">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label for="editTitle">Todo Title *</label>
                    <input type="text" id="editTitle" required>
                </div>
                
                <div class="form-group">
                    <label for="editDescription">Description</label>
                    <textarea id="editDescription"></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="editPriority">Priority</label>
                        <select id="editPriority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="editDueDate">Due Date</label>
                        <input type="date" id="editDueDate">
                    </div>
                </div>
                
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/todos';
        let currentFilter = 'all';
        let currentPriorityFilter = '';
        let currentSearch = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadTodos();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('todoForm').addEventListener('submit', handleAddTodo);
            document.getElementById('editForm').addEventListener('submit', handleEditTodo);
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            document.getElementById('priorityFilter').addEventListener('change', handlePriorityFilter);
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentFilter = e.target.dataset.filter;
                    loadTodos();
                });
            });
        }

        async function loadTodos() {
            try {
                let url = API_URL;
                const params = new URLSearchParams();
                
                if (currentFilter !== 'all') {
                    params.append('status', currentFilter);
                }
                
                if (currentPriorityFilter) {
                    params.append('priority', currentPriorityFilter);
                }
                
                if (currentSearch) {
                    params.append('search', currentSearch);
                }
                
                if (params.toString()) {
                    url += '?' + params.toString();
                }
                
                const response = await fetch(url);
                const todos = await response.json();
                
                renderTodos(todos);
                updateStats(todos);
            } catch (error) {
                console.error('Error loading todos:', error);
            }
        }

        function renderTodos(todos) {
            const todoList = document.getElementById('todoList');
            
            if (todos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                        </svg>
                        <h3>No todos found</h3>
                        <p>Try adjusting your filters or add a new todo!</p>
                    </div>
                `;
                return;
            }
            
            todoList.innerHTML = todos.map(todo => `
                <div class="todo-item ${todo.completed ? 'completed' : ''} priority-${todo.priority}">
                    <input type="checkbox" 
                           class="todo-checkbox" 
                           ${todo.completed ? 'checked' : ''} 
                           onchange="toggleTodo(${todo.id})">
                    
                    <div class="todo-content">
                        <h3>${escapeHtml(todo.title)}</h3>
                        ${todo.description ? `<p>${escapeHtml(todo.description)}</p>` : ''}
                        
                        <div class="todo-meta">
                            <span class="priority-badge priority-${todo.priority}">
                                ${todo.priority}
                            </span>
                            ${todo.due_date ? `
                                <span>📅 ${formatDate(todo.due_date)}</span>
                            ` : ''}
                            <span>🕒 ${formatDateTime(todo.created_at)}</span>
                        </div>
                    </div>
                    
                    <div class="todo-actions">
                        <button class="btn-edit" onclick="openEditModal(${todo.id})">Edit</button>
                        <button class="btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function updateStats(todos) {
            const allTodos = todos;
            const activeTodos = todos.filter(t => !t.completed);
            const completedTodos = todos.filter(t => t.completed);
            
            fetch(API_URL)
                .then(res => res.json())
                .then(allData => {
                    document.getElementById('totalCount').textContent = allData.length;
                    document.getElementById('activeCount').textContent = allData.filter(t => !t.completed).length;
                    document.getElementById('completedCount').textContent = allData.filter(t => t.completed).length;
                });
        }

        async function handleAddTodo(e) {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const priority = document.getElementById('priority').value;
            const due_date = document.getElementById('dueDate').value;
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, priority, due_date })
                });
                
                if (response.ok) {
                    document.getElementById('todoForm').reset();
                    loadTodos();
                }
            } catch (error) {
                console.error('Error adding todo:', error);
                alert('Failed to add todo. Please try again.');
            }
        }

        async function toggleTodo(id) {
            try {
                await fetch(`${API_URL}/${id}/toggle`, {
                    method: 'PATCH'
                });
                loadTodos();
            } catch (error) {
                console.error('Error toggling todo:', error);
            }
        }

        async function deleteTodo(id) {
            if (!confirm('Are you sure you want to delete this todo?')) {
                return;
            }
            
            try {
                await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });
                loadTodos();
            } catch (error) {
                console.error('Error deleting todo:', error);
                alert('Failed to delete todo. Please try again.');
            }
        }

        async function openEditModal(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const todo = await response.json();
                
                document.getElementById('editId').value = todo.id;
                document.getElementById('editTitle').value = todo.title;
                document.getElementById('editDescription').value = todo.description || '';
                document.getElementById('editPriority').value = todo.priority;
                document.getElementById('editDueDate').value = todo.due_date || '';
                
                document.getElementById('editModal').classList.add('active');
            } catch (error) {
                console.error('Error loading todo:', error);
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        async function handleEditTodo(e) {
            e.preventDefault();
            
            const id = document.getElementById('editId').value;
            const title = document.getElementById('editTitle').value;
            const description = document.getElementById('editDescription').value;
            const priority = document.getElementById('editPriority').value;
            const due_date = document.getElementById('editDueDate').value;
            
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, description, priority, due_date })
                });
                
                if (response.ok) {
                    closeEditModal();
                    loadTodos();
                }
            } catch (error) {
                console.error('Error updating todo:', error);
                alert('Failed to update todo. Please try again.');
            }
        }

        function handleSearch(e) {
            currentSearch = e.target.value;
            loadTodos();
        }

        function handlePriorityFilter(e) {
            currentPriorityFilter = e.target.value;
            loadTodos();
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
