<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .app-card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .add-todo-form {
      padding: 25px;
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .form-group {
      flex: 1;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #495057;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #dee2e6;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn {
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .filters {
      display: flex;
      gap: 15px;
      padding: 20px 25px;
      background: #fff;
      border-bottom: 2px solid #e9ecef;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 20px;
      background: #e9ecef;
      color: #495057;
      border: none;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .filter-btn:hover {
      background: #dee2e6;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .stats {
      display: flex;
      gap: 20px;
      padding: 15px 25px;
      background: #f8f9fa;
      border-bottom: 2px solid #e9ecef;
      font-size: 0.9rem;
      color: #495057;
      font-weight: 600;
    }

    .stats span {
      padding: 5px 15px;
      background: white;
      border-radius: 15px;
    }

    .todo-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 20px 25px;
      border-bottom: 1px solid #e9ecef;
      transition: background 0.3s;
    }

    .todo-item:hover {
      background: #f8f9fa;
    }

    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-checkbox {
      width: 24px;
      height: 24px;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 5px;
    }

    .todo-content {
      flex: 1;
    }

    .todo-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: #212529;
    }

    .todo-item.completed .todo-title {
      text-decoration: line-through;
    }

    .todo-description {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .todo-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .priority-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .priority-high {
      background: #dc3545;
      color: white;
    }

    .priority-medium {
      background: #ffc107;
      color: #000;
    }

    .priority-low {
      background: #28a745;
      color: white;
    }

    .due-date {
      color: #6c757d;
      font-size: 0.85rem;
    }

    .todo-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-icon {
      padding: 8px 12px;
      background: #e9ecef;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9rem;
    }

    .btn-icon:hover {
      background: #dee2e6;
    }

    .btn-delete:hover {
      background: #dc3545;
      color: white;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6c757d;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .clear-completed {
      padding: 10px 25px;
      text-align: right;
      background: #f8f9fa;
      border-top: 2px solid #e9ecef;
    }

    .btn-clear {
      padding: 8px 20px;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-clear:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✅ Todo App</h1>
      <p>Stay organized and get things done</p>
    </div>

    <div class="app-card">
      <div class="add-todo-form">
        <form id="todoForm">
          <div class="form-group">
            <label for="todoTitle">Title *</label>
            <input type="text" id="todoTitle" placeholder="What needs to be done?" required>
          </div>
          
          <div class="form-group">
            <label for="todoDescription">Description</label>
            <textarea id="todoDescription" placeholder="Add more details..."></textarea>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="todoPriority">Priority</label>
              <select id="todoPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="todoDueDate">Due Date</label>
              <input type="date" id="todoDueDate">
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary">Add Todo</button>
        </form>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
        <button class="filter-btn" data-filter="high">High Priority</button>
        <button class="filter-btn" data-filter="medium">Medium Priority</button>
        <button class="filter-btn" data-filter="low">Low Priority</button>
      </div>

      <div class="stats">
        <span>Total: <strong id="totalCount">0</strong></span>
        <span>Active: <strong id="activeCount">0</strong></span>
        <span>Completed: <strong id="completedCount">0</strong></span>
      </div>

      <div class="todo-list" id="todoList"></div>

      <div class="clear-completed" id="clearCompletedSection" style="display: none;">
        <button class="btn-clear" id="clearCompletedBtn">Clear Completed</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api/todos';
    let currentFilter = 'all';
    let todos = [];

    async function loadTodos() {
      try {
        const response = await fetch(API_URL);
        todos = await response.json();
        renderTodos();
        updateStats();
      } catch (error) {
        console.error('Error loading todos:', error);
      }
    }

    async function addTodo(e) {
      e.preventDefault();
      
      const title = document.getElementById('todoTitle').value.trim();
      const description = document.getElementById('todoDescription').value.trim();
      const priority = document.getElementById('todoPriority').value;
      const dueDate = document.getElementById('todoDueDate').value;

      if (!title) return;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, description, priority, due_date: dueDate || null })
        });

        if (response.ok) {
          document.getElementById('todoForm').reset();
          await loadTodos();
        }
      } catch (error) {
        console.error('Error adding todo:', error);
      }
    }

    async function toggleTodo(id) {
      try {
        await fetch(`${API_URL}/${id}/toggle`, { method: 'PATCH' });
        await loadTodos();
      } catch (error) {
        console.error('Error toggling todo:', error);
      }
    }

    async function deleteTodo(id) {
      if (!confirm('Are you sure you want to delete this todo?')) return;
      
      try {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        await loadTodos();
      } catch (error) {
        console.error('Error deleting todo:', error);
      }
    }

    async function clearCompleted() {
      if (!confirm('Clear all completed todos?')) return;
      
      try {
        await fetch(`${API_URL}/completed`, { method: 'DELETE' });
        await loadTodos();
      } catch (error) {
        console.error('Error clearing completed todos:', error);
      }
    }

    function filterTodos() {
      return todos.filter(todo => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'active') return !todo.completed;
        if (currentFilter === 'completed') return todo.completed;
        if (currentFilter === 'high' || currentFilter === 'medium' || currentFilter === 'low') {
          return todo.priority === currentFilter;
        }
        return true;
      });
    }

    function renderTodos() {
      const todoList = document.getElementById('todoList');
      const filteredTodos = filterTodos();

      if (filteredTodos.length === 0) {
        todoList.innerHTML = `
          <div class="empty-state">
            <h3>📝 No todos found</h3>
            <p>Add a new todo to get started!</p>
          </div>
        `;
      } else {
        todoList.innerHTML = filteredTodos.map(todo => {
          const dueDate = todo.due_date ? new Date(todo.due_date).toLocaleDateString('en-US', { 
            month: 'short', day: 'numeric', year: 'numeric' 
          }) : '';

          return `
            <div class="todo-item ${todo.completed ? 'completed' : ''}">
              <input type="checkbox" class="todo-checkbox" 
                ${todo.completed ? 'checked' : ''} 
                onchange="toggleTodo(${todo.id})">
              <div class="todo-content">
                <div class="todo-title">${todo.title}</div>
                ${todo.description ? `<div class="todo-description">${todo.description}</div>` : ''}
                <div class="todo-meta">
                  <span class="priority-badge priority-${todo.priority}">${todo.priority.toUpperCase()}</span>
                  ${dueDate ? `<span class="due-date">📅 Due: ${dueDate}</span>` : ''}
                </div>
              </div>
              <div class="todo-actions">
                <button class="btn-icon btn-delete" onclick="deleteTodo(${todo.id})">🗑️</button>
              </div>
            </div>
          `;
        }).join('');
      }

      const hasCompleted = todos.some(todo => todo.completed);
      document.getElementById('clearCompletedSection').style.display = hasCompleted ? 'block' : 'none';
    }

    function updateStats() {
      const total = todos.length;
      const active = todos.filter(t => !t.completed).length;
      const completed = todos.filter(t => t.completed).length;

      document.getElementById('totalCount').textContent = total;
      document.getElementById('activeCount').textContent = active;
      document.getElementById('completedCount').textContent = completed;
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
      renderTodos();
    }

    document.getElementById('todoForm').addEventListener('submit', addTodo);
    document.getElementById('clearCompletedBtn').addEventListener('click', clearCompleted);
    
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => setFilter(btn.dataset.filter));
    });

    loadTodos();
  </script>
</body>
</html>
