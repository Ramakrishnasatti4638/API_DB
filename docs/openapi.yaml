openapi: 3.0.3
info:
  title: Orders API
  description: HTTP API for managing orders.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /orders:
    get:
      summary: List orders
      description: Returns a paginated list of orders. When called without query parameters, returns up to the default page size (50) starting at offset 0.
      parameters:
        - in: query
          name: limit
          required: false
          description: Maximum number of orders to return. Must be a whole number between 1 and 200. Defaults to 50 when omitted.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - in: query
          name: offset
          required: false
          description: Number of orders to skip before returning results. Must be a whole number greater than or equal to 0. Defaults to 0 when omitted.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: Bad request. Returned when a query parameter is not a whole number or is outside its allowed range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                example:
                  error: "limit must be a whole number between 1 and 200"

  /orders/{id}:
    delete:
      summary: Delete an order
      description: Removes the order with the given id. Returns 204 on success, 404 if no order with that id exists, or 400 if the id is not a positive integer.
      parameters:
        - in: path
          name: id
          required: true
          description: Order id. Must be a positive integer.
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: Order deleted successfully. No content is returned.
        '400':
          description: Bad request. Returned when the id is not a positive integer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                example:
                  error: "id must be a positive integer"
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                example:
                  error: "order 9999 not found"
        '400':
          description: Bad request. Returned when the id is not a positive integer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                example:
                  error: "id must be a positive integer"
    patch:
      summary: Update an order
      description: Partially updates an order. Any combination of `userId`, `total`, and `status` may be provided; unspecified fields are left unchanged. Returns 200 with the updated order on success, 404 if no order with that id exists, or 400 if the id is invalid, the body is malformed, the body contains no updatable fields, or any provided field has an invalid value. The `id` and `createdAt` fields cannot be updated.
      parameters:
        - in: path
          name: id
          required: true
          description: Order id. Must be a positive integer.
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                userId:
                  type: integer
                  minimum: 1
                  description: New userId. Must be a positive integer.
                total:
                  type: number
                  format: float
                  minimum: 0
                  description: New total. Must be a non-negative finite number.
                status:
                  type: string
                  enum: [pending, paid, shipped, cancelled]
                  description: New status. Must be one of the allowed values.
            example:
              status: shipped
              total: 99.5
      responses:
        '200':
          description: Order updated successfully. Returns the updated order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Bad request. Returned when the id is not a positive integer, the body is malformed, the body contains no updatable fields, an immutable field is provided, or any provided field has an invalid value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                example:
                  error: "status must be one of: pending, paid, shipped, cancelled"
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                  - error
                example:
                  error: "order 9999 not found"

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

components:
  schemas:
    Order:
      type: object
      required:
        - id
        - userId
        - total
        - status
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        total:
          type: number
          format: float
          example: 19.99
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
          example: paid
        createdAt:
          type: string
          format: date-time
          example: 2024-01-01T10:00:00Z
