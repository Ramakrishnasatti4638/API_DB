openapi: 3.0.3
info:
  title: Orders API
  description: HTTP API for managing orders, persisted in SQLite.
  version: 2.0.0
servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /orders:
    get:
      summary: List orders
      description: Returns a paginated list of orders, newest first, with their line items.
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          description: Only return orders with this status.
          schema: { type: string, example: Pending }
      responses:
        '200':
          description: A page of orders (`items` is empty when nothing matches).
          content:
            application/json:
              schema:
                type: object
                required: [items, totalCount, page, pageSize]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  totalCount:
                    type: integer
                    description: Total orders matching the filter.
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20
        '400':
          description: Invalid page, pageSize or status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses:
        '201':
          description: Order created with status Pending.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400':
          description: Validation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Database error; nothing was persisted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        errors:
          type: array
          items: { type: string }
    CreateOrderItem:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: string, minLength: 1 }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, minimum: 0, example: 19.99 }
    CreateOrder:
      type: object
      required: [customerId, items, totalAmount]
      properties:
        customerId: { type: string, minLength: 1 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderItem' }
        totalAmount: { type: number, minimum: 0, example: 19.99 }
    OrderItem:
      allOf:
        - $ref: '#/components/schemas/CreateOrderItem'
        - type: object
          required: [id]
          properties:
            id: { type: string }
    Order:
      type: object
      required: [id, customerId, items, totalAmount, status, createdAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        totalAmount: { type: number }
        status: { type: string, example: Pending }
        createdAt: { type: string, format: date-time }
